[project]
name = "card-platform-api"
version = "0.1.0"
description = "Basketball card investment management API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "aiofiles>=24.1,<25",
  "httpx[socks]>=0.28,<1",
  "openai>=2.20,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]
