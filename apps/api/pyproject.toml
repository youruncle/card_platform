[project]
name = "card-platform-api"
version = "0.6.2"
description = "Basketball card investment management API"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "aiofiles>=24.1,<25",
  "httpx[socks]>=0.28,<1",
  "numpy>=2.1,<3",
  "openai>=2.20,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
checklists = ["pypdf>=6,<7", "openpyxl>=3.1,<4"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]

[tool.setuptools.package-data]
card_platform = ["data/*.json"]
