services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-card_platform}
      POSTGRES_USER: ${POSTGRES_USER:-card_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-card_platform}
    ports:
      - "5432:5432"
    volumes:
      - card_platform_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  card_platform_postgres:
