# Enable only after a valid IP certificate and public TCP 443 are verified.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name 1.117.65.47;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 308 https://1.117.65.47$request_uri; }
}
server {
    listen 443 ssl;
    server_name 1.117.65.47;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/1.117.65.47/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1.117.65.47/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 220m;
    client_body_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
