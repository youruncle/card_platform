# Domain certificate is supplied separately; never commit private keys.
server {
    listen 80;
    server_name cardsp.cn www.cardsp.cn;
    return 308 https://cardsp.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name cardsp.cn www.cardsp.cn;
    server_tokens off;
    ssl_certificate /etc/nginx/ssl/cardsp.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cardsp.cn/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cardsp_tls:10m;
    ssl_session_timeout 1d;
    client_max_body_size 220m;
    client_body_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cookie_flags ~ secure;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
